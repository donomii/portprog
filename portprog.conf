# Portprog configuration format. Version 1 is the only supported value.
schema_version = 1

# Profile installed when a command does not name another profile.
default_profile = starter

# Versioned tools are installed here, relative to this Portprog directory.
install_root = portable

# Verified downloads are cached here by SHA-256 for reuse and offline packs.
cache_root = cache

# Installation receipts are stored here so Portprog can verify local state.
state_root = state

# Replaced, failed, and removed files are moved here instead of being deleted.
trash_root = trash

# Strict package JSON files are loaded from this relative directory.
catalog_dir = catalog

# Explained package selections are loaded from this relative directory.
profiles_dir = profiles

# Exact current-platform package choices are written to this relative file.
lock_file = portprog.lock.json

# Set true to forbid network access and require every download in the cache.
offline = false

# Reject a single compressed download larger than this many mebibytes.
max_download_mb = 512

# Stop one archive after producing this many uncompressed mebibytes.
max_extract_mb = 4096

# Abort a complete HTTP request, including its body, after this many seconds.
download_timeout_seconds = 600
